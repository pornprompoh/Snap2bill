name: Flutter CI

on:
  # Run validation for pushes and pull requests on every branch.
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  # Job 1: install the toolchains and reject formatting or analyzer issues.
  job-1-code-analysis:
    name: 1. Code Analysis & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The application bundles .env as an asset; dummy values are sufficient
      # for static checks and must not contain production credentials.
      - name: Create dummy environment file
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_key
          GEMINI_API_KEY=dummy_key
          EOF

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart and Flutter code
        run: flutter analyze

  # Job 2: run the full suite, filter non-core files, and enforce >=70%.
  job-2-testing-and-coverage:
    name: 2. Testing & Coverage Check (>=70%)
    runs-on: ubuntu-latest
    needs: job-1-code-analysis
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keep the asset available during tests without exposing real credentials.
      - name: Create dummy environment file
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_key
          GEMINI_API_KEY=dummy_key
          EOF

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Filter generated and UI coverage
        run: dart run tool/filter_coverage.dart

      - name: Install coverage threshold tool
        run: dart pub global activate test_cov_console

      - name: Enforce 70% core coverage
        run: dart pub global run test_cov_console --pass=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  # Job 3: build and archive the Android release APK.
  job-3-build-android:
    name: 3. Build Android App (APK)
    runs-on: ubuntu-latest
    needs: job-2-testing-and-coverage
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy environment file
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_key
          GEMINI_API_KEY=dummy_key
          EOF

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: snap2bill-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Job 4: build the web release in parallel with the Android build.
  job-4-build-web:
    name: 4. Build Web Platform
    runs-on: ubuntu-latest
    needs: job-2-testing-and-coverage
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy environment file
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_key
          GEMINI_API_KEY=dummy_key
          EOF

      - name: Build web release
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: snap2bill-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 14
